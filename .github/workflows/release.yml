name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun test
      - name: Build the notes from ANNOUNCE.md
        run: bun scripts/release-body.ts "${GITHUB_REF_NAME#v}" > release-body.md
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title=$GITHUB_REF_NAME
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq '.object.type + " " + .object.sha')
          type=${ref%% *}
          sha=${ref##* }
          if [ "$type" = "tag" ]; then
            title=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq '.message' | head -1)
          fi
          title=${title:-$GITHUB_REF_NAME}
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$title" --notes-file release-body.md
          else
            gh release create "$GITHUB_REF_NAME" --title "$title" --notes-file release-body.md
          fi
